services:
  ministack:
    extends:
      file: docker-compose.cache.yml
      service: ministack

  aws-cli:
    extends:
      file: docker-compose.cache.yml
      service: aws-cli

  db:
    image: postgres:16
    container_name: viajajunto_db
    restart: unless-stopped
    depends_on:
      aws-cli:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viajajunto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viajajunto}
      POSTGRES_DB: ${POSTGRES_DB:-viajajunto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - viajajunto_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viajajunto} -d ${POSTGRES_DB:-viajajunto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Banco exclusivo dos testes (pytest), separado dos dados de desenvolvimento.
  # Sobe so com `docker compose --profile test up -d db_test`; dados ficam em memoria.
  db_test:
    image: postgres:16
    container_name: viajajunto_db_test
    profiles: [test]
    environment:
      POSTGRES_USER: viajajunto
      POSTGRES_PASSWORD: viajajunto
      POSTGRES_DB: viajajunto_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajajunto -d viajajunto_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor SMTP falso para desenvolvimento e testes manuais: captura todos os
  # emails enviados pela API (nada sai para a internet). Caixa de entrada em
  # http://localhost:8025. Ver docs/recuperacao-de-senha.md.
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: viajajunto_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # interface web e API HTTP
      - "1025:1025"  # SMTP

  api:
    build: .
    container_name: viajajunto_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      aws-cli:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks: [default, cache]
    environment:
      # Ambiente local: aceita o segredo JWT de desenvolvimento se nenhum for definido.
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      REDIS_URL_FILE: /run/cache/redis-url
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-viajajunto}:${POSTGRES_PASSWORD:-viajajunto}@db:5432/${POSTGRES_DB:-viajajunto}
      SEED_CATALOGO: ${SEED_CATALOGO:-true}
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      RECUPERACAO_SENHA_URL: ${RECUPERACAO_SENHA_URL:-http://localhost:3000/redefinir-senha}
    ports:
      - "8000:8000"
    volumes:
      - cache-endpoint:/run/cache:ro
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./docs/catalogo-exemplo.json:/app/docs/catalogo-exemplo.json:ro
    # Migrações criam o schema; os seeds locais preparam os dados em seguida.
    # O seed completo só cria os cenários na primeira execução e preserva edições.
    command: >-
      sh -c 'alembic upgrade head &&
      if [ "$$APP_ENV" = "development" ]; then
        python -m app.adapters.inbound.cli.seed_demo;
      fi &&
      if [ "$$SEED_CATALOGO" = "true" ]; then
        python -m app.adapters.inbound.cli.importar_catalogo --se-vazio --exemplo;
      fi &&
      if [ "$$APP_ENV" = "development" ]; then
        python -m app.adapters.inbound.cli.seed_demo --completo;
      fi &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'

volumes:
  viajajunto_db_data:
  ministack-state:
  cache-endpoint:

networks:
  default:
  cache:
    name: viajajunto-cache-local
