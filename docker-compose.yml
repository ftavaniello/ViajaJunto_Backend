services:
  ministack:
    extends:
      file: docker-compose.cache.yml
      service: ministack

  aws-cli:
    extends:
      file: docker-compose.cache.yml
      service: aws-cli

  db:
    image: postgres:16
    container_name: viajajunto_db
    restart: unless-stopped
    depends_on:
      aws-cli:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viajajunto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viajajunto}
      POSTGRES_DB: ${POSTGRES_DB:-viajajunto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - viajajunto_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viajajunto} -d ${POSTGRES_DB:-viajajunto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: viajajunto_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      aws-cli:
        condition: service_completed_successfully
    networks: [default, cache]
    environment:
      # Ambiente local: aceita o segredo JWT de desenvolvimento se nenhum for definido.
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      REDIS_URL_FILE: /run/cache/redis-url
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-viajajunto}:${POSTGRES_PASSWORD:-viajajunto}@db:5432/${POSTGRES_DB:-viajajunto}
    ports:
      - "8000:8000"
    volumes:
      - cache-endpoint:/run/cache:ro
      - ./app:/app/app
      - ./alembic:/app/alembic
    # Migracoes provisionam so o schema; a conta de demonstracao e semeada a parte,
    # apenas em desenvolvimento (o script tambem recusa outros ambientes).
    command: >-
      sh -c "alembic upgrade head
      && { [ \"$$APP_ENV\" != development ] || python -m app.adapters.inbound.cli.seed_demo; }
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  viajajunto_db_data:
  ministack-state:
  cache-endpoint:

networks:
  default:
  cache:
    name: viajajunto-cache-local
