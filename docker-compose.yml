services:
  db:
    image: postgres:16
    container_name: viajajunto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viajajunto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viajajunto}
      POSTGRES_DB: ${POSTGRES_DB:-viajajunto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - viajajunto_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viajajunto} -d ${POSTGRES_DB:-viajajunto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: viajajunto_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-viajajunto}:${POSTGRES_PASSWORD:-viajajunto}@db:5432/${POSTGRES_DB:-viajajunto}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  viajajunto_db_data:
