# Local infrastructure only. Can be combined with docker-compose.yml.
services:
  ministack:
    image: ministackorg/ministack:1.5.21
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      DOCKER_NETWORK: viajajunto-cache-local
      MINISTACK_HOSTNAME: viajajunto-cache-local
      PERSIST_STATE: "1"
      STATE_DIR: /tmp/ministack-state
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ministack-state:/tmp/ministack-state
    networks: [cache]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  aws-cli:
    image: amazon/aws-cli:2.37.10
    entrypoint: ["/bin/sh", "/infra/deploy.sh"]
    command: []
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    volumes:
      - ./infra:/infra:ro
    networks: [cache]
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"

networks:
  cache:
    name: viajajunto-cache-local

volumes:
  ministack-state:
